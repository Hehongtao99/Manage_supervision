server:
  port: 8081

spring:
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/560?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认数据源配置
    url: jdbc:mysql://127.0.0.1:3306/560?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  

# MyBatis-Plus配置
mybatis-plus:
  # 实体扫描，多个包用逗号或者分号分隔
  type-aliases-package: com.example.auth.entity
  # Mapper XML位置
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 配置控制台打印完整带参数SQL语句
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键类型（AUTO：数据库自增ID）
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑删除值（默认为1）
      logic-delete-value: 1
      # 逻辑未删除值（默认为0）
      logic-not-delete-value: 0

jwt:
  secret: your_jwt_secret_key_here_please_change_in_production
  expiration: 86400000  # 24小时 