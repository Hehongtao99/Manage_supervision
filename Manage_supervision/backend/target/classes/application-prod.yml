# MyBatis-Plus配置
mybatis-plus:
  # 实体扫描，多个包用逗号或者分号分隔
  type-aliases-package: com.example.auth.entity
  # Mapper XML位置
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 关闭SQL日志打印，提高性能
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      # 主键类型（AUTO：数据库自增ID）
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑删除值（默认为1）
      logic-delete-value: 1
      # 逻辑未删除值（默认为0）
      logic-not-delete-value: 0

jwt:
  secret: prod_jwt_secret_key_must_be_changed_in_production
  expiration: 86400000  # 24小时 

# 文件上传配置
app:
  upload:
    dir: uploads # 上传文件存储的根目录
    course-images-dir: course-images # 课程图片存储的子目录
file:
  upload:
    path: uploads

# 日志配置 - 生产环境降低日志级别
logging:
  level:
    root: WARN
    com.example.auth: ERROR
    com.example.auth.mapper: ERROR
    org.springframework.web: WARN 